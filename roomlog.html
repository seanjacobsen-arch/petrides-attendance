<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Room Log</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

/* Header */
.hdr{background:#003DA5;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.hdr-left{flex:1}
.hdr-period{font-size:13px;font-weight:800;color:rgba(255,255,255,.7)}
.hdr-class{font-size:19px;font-weight:900;color:#fff}
.hdr-time{font-size:24px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.hdr-date{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;text-align:right}

/* Out bar */
.out-bar{padding:8px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex-shrink:0;min-height:48px;border-bottom:1px solid #334155}
.out-bar.occupied{background:#3b0764}
.out-bar.empty{background:#1e293b}
.out-label{font-size:11px;font-weight:900;color:#c4b5fd;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.out-chip{background:rgba(167,139,250,.2);border:1.5px solid #7c3aed;border-radius:22px;padding:6px 14px;font-size:14px;font-weight:800;color:#ddd6fe;cursor:pointer;white-space:nowrap;transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.out-chip:active{background:rgba(167,139,250,.4);transform:scale(.96)}

.out-none{font-size:12px;color:#475569;font-weight:700}

/* Two columns */
.cols{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}
.col{display:flex;flex-direction:column;border-right:1px solid #1e293b}
.col:last-child{border-right:none}
.col-hdr{padding:10px 14px;background:#1e293b;border-bottom:1px solid #334155;flex-shrink:0}
.col-title{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.col-sub{font-size:10px;color:#64748b;font-weight:700;margin-top:2px}
.col-hdr.late .col-title{color:#fbbf24}
.col-hdr.bath .col-title{color:#38bdf8}
.stu-list{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:#334155 transparent}

/* Student buttons — large for easy tapping */
.stu-btn{width:100%;text-align:left;padding:13px 14px;margin-bottom:7px;border:none;border-radius:12px;font-family:inherit;cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:10px}
.stu-btn:active{transform:scale(.97)}
.stu-av{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
.stu-name{font-size:15px;font-weight:800;flex:1;text-align:left}

.stu-btn.late{background:#1c1007;color:#fde68a;border:1.5px solid #78350f}
.stu-btn.late:active{background:#292606}

.stu-btn.bath{background:#082f49;color:#bae6fd;border:1.5px solid #075985}
.stu-btn.bath:active{background:#0c4a6e}

.stu-btn.out-dim{background:#0f172a;color:#475569;border:1.5px solid #1e293b;pointer-events:none;opacity:.5}

/* Flash feedback */
.stu-btn.flash-ok{animation:flashOk .6s ease}
@keyframes flashOk{0%{background:#064e3b;border-color:#059669}100%{}}

.empty-msg{color:#334155;font-size:13px;font-weight:700;padding:20px 14px;text-align:center}

/* No period screen */
.no-period{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.no-period .icon{font-size:52px}
.no-period h2{font-size:22px;font-weight:900;color:#f1f5f9}
.no-period p{font-size:14px;font-weight:700;color:#64748b}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-period" id="hdrPeriod">Loading…</div>
    <div class="hdr-class" id="hdrClass"></div>
  </div>
  <div>
    <div class="hdr-time" id="hdrTime">--:--</div>
    <div class="hdr-date" id="hdrDate"></div>
  </div>
</div>

<div class="out-bar empty" id="outBar">
  <span class="out-label">🚻 Out now:</span>
  <span class="out-none" id="outNone">Nobody out right now</span>
</div>

<div class="cols" id="mainCols">
  <div class="col">
    <div class="col-hdr late">
      <div class="col-title">⏱ Arriving Late</div>
      <div class="col-sub">Tap your name — one tap, done</div>
    </div>
    <div class="stu-list" id="lateList"></div>
  </div>
  <div class="col">
    <div class="col-hdr bath">
      <div class="col-title">🚻 Leaving / Returning</div>
      <div class="col-sub">Tap to sign out · Tap banner to sign back in</div>
    </div>
    <div class="stu-list" id="bathList"></div>
  </div>
</div>

<div class="no-period" id="noPeriod">
  <div class="icon">🏫</div>
  <h2>No class right now</h2>
  <p id="nextMsg"></p>
</div>

<script>
firebase.initializeApp({
  apiKey:'AIzaSyDEk2S078stgwL5Z4_QluThFvxhwFKtwhk',
  authDomain:'jacobsen-attendance-2627.firebaseapp.com',
  databaseURL:'https://jacobsen-attendance-2627-default-rtdb.firebaseio.com/',
  appId:'1:778437887000:web:429ff330dc7847c2cdef6d'
});
const db = firebase.database();

const PERIODS=[
  {num:1,s:[8,0], e:[8,49]}, {num:2,s:[8,51],e:[9,36]},
  {num:3,s:[9,38],e:[10,23]},{num:4,s:[10,24],e:[11,10]},
  {num:5,s:[11,12],e:[11,57]},{num:6,s:[11,59],e:[12,44]},
  {num:7,s:[12,46],e:[13,31]},{num:8,s:[13,33],e:[14,20]}
];

let tk='', classes=[], todayState={}, curPeriodNum=null, inFlight=new Set();

const toM=(h,m)=>h*60+m;
const nowM=()=>{const n=new Date();return toM(n.getHours(),n.getMinutes());}
const dkey=()=>new Date().toISOString().slice(0,10);
const init2=(n)=>{ const p=(n||'').split(/[, ]+/); return (p[0]?.[0]||'')+(p[1]?.[0]||p[2]?.[0]||''); }
function avCol(n){ const c=['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#10b981']; let h=0; for(const x of n)h=(h<<5)-h+x.charCodeAt(0); return c[Math.abs(h)%c.length]; }
function fmt(h,m){ return (h%12||12)+':'+(m<10?'0':'')+m+' '+(h>=12?'PM':'AM'); }

function curPeriod(){ const nm=nowM(); return PERIODS.find(p=>nm>=toM(...p.s)&&nm<=toM(...p.e))||null; }
function nextPeriod(){ const nm=nowM(); return PERIODS.find(p=>toM(...p.s)>nm)||null; }
function curClass(){ const p=curPeriod(); if(!p)return null; curPeriodNum=p.num; return classes.find(c=>c.periodNum===p.num)||null; }

// ── Init ─────────────────────────────────────────────────────
(function(){
  const params=new URLSearchParams(location.search);
  tk=(params.get('t')||'').replace(/[^a-z0-9_]/g,'');
  if(!tk){ document.body.innerHTML='<div style="padding:40px;color:#f87171">No ?t= teacher key in URL.</div>'; return; }

  db.ref('teachers/'+tk+'/classes').on('value',s=>{classes=s.val()||[];render();});
  db.ref('teachers/'+tk+'/state/'+dkey()).on('value',s=>{todayState=s.val()||{};render();});

  setInterval(updateClock,1000);
  setInterval(render,30000); // re-render every 30s catches period switch
  updateClock();
})();

function updateClock(){
  const n=new Date();
  const h=n.getHours(),m=n.getMinutes();
  document.getElementById('hdrTime').textContent=fmt(h,m);
  document.getElementById('hdrDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  // Elapsed time counted internally but not displayed
}

function render(){
  const cls=curClass();

  if(!cls){
    document.getElementById('mainCols').style.display='none';
    document.getElementById('outBar').style.display='none';
    document.getElementById('noPeriod').style.display='flex';
    const np=nextPeriod();
    const nc=np?classes.find(c=>c.periodNum===np.num):null;
    document.getElementById('nextMsg').textContent=
      nc?'Next: Period '+np.num+' — '+nc.label+' at '+fmt(...np.s):'No more classes today';
    document.getElementById('hdrPeriod').textContent='No active period';
    document.getElementById('hdrClass').textContent='';
    return;
  }

  document.getElementById('mainCols').style.display='grid';
  document.getElementById('outBar').style.display='flex';
  document.getElementById('noPeriod').style.display='none';
  document.getElementById('hdrPeriod').textContent='Period '+cls.periodNum;
  document.getElementById('hdrClass').textContent=cls.label;

  const students=cls.students||[];
  const outNow=[], lateStudents=[], bathStudents=[];

  students.forEach(name=>{
    const s=todayState[name]||{};
    const status=s.status||'';
    const bathLog=s.bathroomLog||[];
    const currentlyOut=bathLog.find(e=>e.period===curPeriodNum&&!e.in);

    if(currentlyOut) outNow.push({name,outTime:currentlyOut.out});
    else if(!status||status==='absent') lateStudents.push(name);
    else bathStudents.push(name);
  });

  // ── Out bar ─────────────────────────────────────────────────
  const ob=document.getElementById('outBar');
  const on=document.getElementById('outNone');
  ob.className=outNow.length?'out-bar occupied':'out-bar empty';
  on.style.display=outNow.length?'none':'';
  ob.querySelectorAll('.out-chip').forEach(e=>e.remove());
  outNow.forEach(({name,outTime})=>{
    const chip=document.createElement('button');
    chip.className='out-chip';
    chip.dataset.outTime=outTime;
chip.textContent=name;
    chip.onclick=()=>signBack(name,chip.dataset.outTime);
    ob.insertBefore(chip,on);
  });

  // ── Late column ─────────────────────────────────────────────
  const ll=document.getElementById('lateList');
  ll.innerHTML=lateStudents.length
    ?lateStudents.map(n=>`<button class="stu-btn late" id="btn_${safe(n)}" onclick="signLate('${esc(n)}')">
        <div class="stu-av" style="background:${avCol(n)}">${init2(n)}</div>
        <span class="stu-name">${n}</span>
      </button>`).join('')
    :'<div class="empty-msg">Everyone is present ✓</div>';

  // ── Bath column ─────────────────────────────────────────────
  const bl=document.getElementById('bathList');
  bl.innerHTML=[
    ...bathStudents.map(n=>`<button class="stu-btn bath" id="btn_${safe(n)}" onclick="signOut('${esc(n)}')">
        <div class="stu-av" style="background:${avCol(n)}">${init2(n)}</div>
        <span class="stu-name">${n}</span>
      </button>`),
    ...outNow.map(({name:n})=>`<button class="stu-btn out-dim" disabled>
        <div class="stu-av" style="background:#4c1d95">${init2(n)}</div>
        <span class="stu-name">${n} <span style="font-size:11px">— currently out</span></span>
      </button>`)
  ].join('')||'<div class="empty-msg">Tap a student in the Late column first</div>';
}

function safe(n){ return n.replace(/[^a-zA-Z0-9]/g,'_'); }
function esc(n){ return n.replace(/'/g,"\\'"); }

// ── ONE TAP: sign in late ────────────────────────────────────
// No confirm, no pass, no reasons — teacher fills that in later
function signLate(name){
  if(inFlight.has(name)) return;
  inFlight.add(name);
  const pRef=PERIODS.find(p=>p.num===curPeriodNum);
  const nm=nowM();
  const mins=pRef?Math.max(1,nm-toM(...pRef.s)):1;
  const ref=db.ref('teachers/'+tk+'/state/'+dkey()+'/'+name.replace(/[.#$[\]]/g,'_'));
  ref.update({status:'late',minutesLate:String(mins)},err=>{
    inFlight.delete(name);
    if(!err){
      // Flash the button green briefly, then it disappears on re-render
      const btn=document.getElementById('btn_'+safe(name));
      if(btn){btn.classList.add('flash-ok');btn.textContent='✓ Signed in';}
    }
  });
}

// ── ONE TAP: sign out for bathroom ────────────────────────────
function signOut(name){
  if(inFlight.has(name)) return;
  inFlight.add(name);
  const ref=db.ref('teachers/'+tk+'/state/'+dkey()+'/'+name.replace(/[.#$[\]]/g,'_'));
  ref.once('value',snap=>{
    const cur=snap.val()||{};
    const bathLog=cur.bathroomLog||[];
    bathLog.push({out:new Date().toISOString(),in:null,period:curPeriodNum});
    const evts={...(cur.events||{}),bathroom:(cur.events?.bathroom||0)+1};
    ref.update({bathroomLog:bathLog,events:evts},err=>{
      inFlight.delete(name);
      const btn=document.getElementById('btn_'+safe(name));
      if(!err&&btn){btn.classList.add('flash-ok');btn.textContent='✓ Signed out';}
    });
  });
}

// ── ONE TAP: sign back in from bathroom ──────────────────────
function signBack(name,outTime){
  if(inFlight.has(name)) return;
  inFlight.add(name);
  const now=new Date();
  const mins=Math.max(1,Math.floor((now.getTime()-new Date(outTime).getTime())/60000));
  const ref=db.ref('teachers/'+tk+'/state/'+dkey()+'/'+name.replace(/[.#$[\]]/g,'_'));
  ref.once('value',snap=>{
    const cur=snap.val()||{};
    const bathLog=(cur.bathroomLog||[]).map(e=>
      (e.period===curPeriodNum&&!e.in)?{...e,in:now.toISOString(),durationMins:mins}:e
    );
    const evtMins={...(cur.eventMins||{}),bathroom:(cur.eventMins?.bathroom||0)+mins};
    ref.update({bathroomLog:bathLog,eventMins:evtMins},err=>{inFlight.delete(name);});
  });
}
</script>
</body></html>
