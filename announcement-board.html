<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Board — Announcements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700;900&family=Bebas+Neue&family=Oswald:wght@500;700&family=Merriweather:wght@700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0B1220;
    --panel: #131B2E;
    --panel-2: #1B2540;
    --line: #263155;
    --amber: #FFB84D;
    --text: #EDEFF5;
    --muted: #8894AB;
    --danger: #F87171;
    --good: #4ADE80;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--navy);color:var(--text);font-family:'Inter',sans-serif;height:100%;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- top nav ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:26px;letter-spacing:0.5px;color:var(--amber);}
  .brand .sub{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:2px;}
  .tabs{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:10px;}
  .tab-btn{
    border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;
    font-weight:600;font-size:14px;padding:9px 18px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s;
  }
  .tab-btn.active{background:var(--amber);color:#1a1400;}

  /* ---------- editor layout ---------- */
  .editor-wrap{flex:1;display:grid;grid-template-columns: 420px 1fr;gap:0;}
  @media (max-width: 900px){ .editor-wrap{grid-template-columns:1fr;} }
  .panel{padding:26px;overflow-y:auto;}
  .panel.form{border-right:1px solid var(--line);background:var(--panel);max-height:calc(100vh - 74px);}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  input[type=text],textarea,select,input[type=datetime-local]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:11px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;}

  .swatch-row{display:flex;flex-wrap:wrap;gap:8px;}
  .swatch{
    width:44px;height:44px;border-radius:8px;cursor:pointer;border:2px solid transparent;
    position:relative;flex-shrink:0;
  }
  .swatch.selected{border-color:var(--amber);}
  .swatch.custom-color-wrap{display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--line);}
  .swatch input[type=color]{width:30px;height:30px;border:none;background:none;cursor:pointer;padding:0;}

  .seg{display:flex;gap:6px;}
  .seg button{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    padding:9px 6px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  }
  .seg button.active{background:var(--amber);color:#1a1400;border-color:var(--amber);}

  .pos-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:150px;
    aspect-ratio:1;padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  }
  .pos-grid button{
    background:rgba(255,255,255,0.08);border:1px solid transparent;border-radius:6px;cursor:pointer;
    position:relative;
  }
  .pos-grid button::after{
    content:'';position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;
    background:var(--muted);transform:translate(-50%,-50%);
  }
  .pos-grid button.active{background:rgba(255,184,77,0.18);border-color:var(--amber);}
  .pos-grid button.active::after{background:var(--amber);width:9px;height:9px;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}

  input[type=range]{width:100%;accent-color:var(--amber);}
  .size-readout{font-family:'Space Mono',monospace;color:var(--amber);font-size:13px;}

  .upload-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:1.5px dashed var(--line);border-radius:8px;padding:14px;cursor:pointer;
    color:var(--muted);font-size:13px;font-weight:600;background:var(--panel-2);
  }
  .upload-btn:hover{border-color:var(--amber);color:var(--amber);}
  .img-preview-strip{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .img-preview-strip img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .img-preview-strip button{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;font-weight:700;}

  .primary-btn{
    width:100%;background:var(--amber);color:#1a1400;border:none;padding:14px;border-radius:9px;
    font-weight:800;font-size:15px;cursor:pointer;margin-top:6px;letter-spacing:0.3px;
  }
  .primary-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .primary-btn:hover:not(:disabled){background:#ffc670;}

  /* ---------- preview + manage ---------- */
  .panel.preview-side{background:var(--navy);display:flex;flex-direction:column;gap:22px;}
  .preview-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .preview-frame{
    width:100%;aspect-ratio:9/16;max-width:340px;border-radius:14px;border:3px solid var(--line);
    overflow:hidden;position:relative;box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  }
  .preview-frame .content{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8%;text-align:center;position:relative;
  }
  .preview-frame img.att{max-width:70%;max-height:38%;object-fit:contain;border-radius:6px;margin-bottom:14px;}

  .manage-list{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .manage-card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    display:flex;align-items:center;gap:14px;
  }
  .swatch-mini{width:34px;height:34px;border-radius:6px;flex-shrink:0;background-size:cover;background-position:center;}
  .manage-info{flex:1;min-width:0;}
  .manage-info .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .manage-info .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .manage-status{font-family:'Space Mono',monospace;font-size:11px;padding:3px 8px;border-radius:5px;flex-shrink:0;}
  .manage-status.live{background:rgba(74,222,128,0.15);color:var(--good);}
  .manage-status.expired{background:rgba(248,113,113,0.15);color:var(--danger);}
  .del-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:12px;flex-shrink:0;}
  .del-btn:hover{border-color:var(--danger);color:var(--danger);}
  .empty-note{color:var(--muted);font-size:13px;padding:20px 0;}

  /* ---------- board display ---------- */
  #board-view{
    position:fixed;inset:0;background:#000;display:none;z-index:999;
  }
  #board-view.active{display:block;}
  .board-slide{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6vh 8vw;text-align:center;opacity:0;transition:opacity 0.9s ease-in-out;
  }
  .board-slide.show{opacity:1;}
  .board-slide img.att{max-width:60%;max-height:42vh;object-fit:contain;border-radius:14px;margin-bottom:4vh;box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);}
  .board-slide .msg{white-space:pre-wrap;line-height:1.25;max-width:100%;}
  .board-empty{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    color:#4b5468;background:#050810;
  }
  .board-empty .mk{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:min(9vw,60px);letter-spacing:1px;color:#7b869c;}
  .exit-board{
    position:fixed;top:18px;right:18px;z-index:1001;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
    color:#fff;padding:8px 14px;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;opacity:0.35;
  }
  .exit-board:hover{opacity:1;}
  .board-progress{position:fixed;bottom:0;left:0;height:4px;background:var(--amber);z-index:1001;transition:width linear;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <span class="mark">THE BOARD</span>
      <span class="sub">SCHOOL ANNOUNCEMENTS</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-post" onclick="switchTab('post')">Post</button>
      <button class="tab-btn" id="tab-manage" onclick="switchTab('manage')">Manage</button>
      <button class="tab-btn" id="tab-board" onclick="launchBoard()">Display Board ▸</button>
    </div>
  </div>

  <!-- POST TAB -->
  <div id="view-post" class="editor-wrap">
    <div class="panel form">

      <div class="field">
        <label>Title</label>
        <input type="text" id="f-title" maxlength="60" placeholder="e.g. Pep Rally Friday">
      </div>

      <div class="field">
        <label>Message</label>
        <textarea id="f-message" maxlength="280" placeholder="Details students should see..."></textarea>
      </div>

      <div class="field">
        <label>Background</label>
        <div class="swatch-row" id="bg-swatches"></div>
        <div class="hint" id="bg-image-hint" style="display:none;">Custom image set as background.</div>
        <label class="upload-btn" style="margin-top:10px;">
          📷 Upload background image
          <input type="file" accept="image/*" id="f-bg-upload" style="display:none;">
        </label>
      </div>

      <div class="field">
        <label>Font</label>
        <select id="f-font">
          <option value="Inter" style="font-family:Inter">Inter — clean & modern</option>
          <option value="Poppins" style="font-family:Poppins">Poppins — friendly & rounded</option>
          <option value="'Big Shoulders Display'" selected>Big Shoulders — bold headline</option>
          <option value="Oswald" style="font-family:Oswald">Oswald — tall & sharp</option>
          <option value="'Bebas Neue'">Bebas Neue — condensed poster</option>
          <option value="'Playfair Display'">Playfair Display — elegant serif</option>
          <option value="Merriweather">Merriweather — classic serif</option>
          <option value="'Space Mono'">Space Mono — departure-board mono</option>
          <option value="Caveat">Caveat — handwritten</option>
        </select>
      </div>

      <div class="field">
        <label>Text color</label>
        <div class="swatch-row" id="color-swatches"></div>
      </div>

      <div class="field">
        <label>Text position <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;">— like placing a caption on a photo</span></label>
        <div class="pos-grid" id="pos-grid">
          <button data-h="flex-start" data-v="flex-start"></button>
          <button data-h="center" data-v="flex-start"></button>
          <button data-h="flex-end" data-v="flex-start"></button>
          <button data-h="flex-start" data-v="center"></button>
          <button data-h="center" data-v="center" class="active"></button>
          <button data-h="flex-end" data-v="center"></button>
          <button data-h="flex-start" data-v="flex-end"></button>
          <button data-h="center" data-v="flex-end"></button>
          <button data-h="flex-end" data-v="flex-end"></button>
        </div>
      </div>

      <div class="field">
        <label>Text size — <span class="size-readout" id="size-readout">56px</span></label>
        <input type="range" id="f-size" min="24" max="140" value="56">
      </div>

      <div class="field">
        <label>Attach a picture (shown with the announcement)</label>
        <label class="upload-btn">
          🖼️ Upload image
          <input type="file" accept="image/*" id="f-img-upload" style="display:none;">
        </label>
        <div class="img-preview-strip" id="img-preview-strip" style="display:none;"></div>
      </div>

      <div class="field">
        <label>Take it down after</label>
        <select id="f-duration">
          <option value="1h">1 hour</option>
          <option value="3h">3 hours</option>
          <option value="eod">End of today</option>
          <option value="1d" selected>1 day</option>
          <option value="3d">3 days</option>
          <option value="7d">1 week</option>
          <option value="custom">Custom date &amp; time...</option>
          <option value="never">No expiration</option>
        </select>
        <div class="row2" id="f-custom-wrap" style="display:none;margin-top:8px;">
          <input type="date" id="f-custom-date-part">
          <input type="time" id="f-custom-time-part">
        </div>
      </div>

      <button class="primary-btn" id="post-btn" onclick="postAnnouncement()">Post to the Board</button>
      <div class="hint" id="post-status"></div>
    </div>

    <div class="panel preview-side">
      <div class="preview-label">Live preview</div>
      <div class="preview-frame" id="preview-frame">
        <div class="content" id="preview-content"></div>
      </div>
      <div class="hint">This is roughly how it will look on the standing display.</div>
    </div>
  </div>

  <!-- MANAGE TAB -->
  <div id="view-manage" class="editor-wrap" style="display:none;grid-template-columns:1fr;">
    <div class="panel" style="max-width:820px;margin:0 auto;width:100%;">
      <div class="preview-label" style="margin-bottom:14px;">All announcements</div>
      <div class="manage-list" id="manage-list"></div>
    </div>
  </div>

</div>

<!-- BOARD DISPLAY (fullscreen kiosk) -->
<div id="board-view">
  <button class="exit-board" onclick="exitBoard()">Exit board mode (Esc)</button>
  <div id="board-slides"></div>
  <div class="board-progress" id="board-progress"></div>
</div>

<script>
/* ---------------- state ---------------- */
const BG_PRESETS = [
  {v:'#0B1220'}, {v:'#131B2E'}, {v:'#FFFFFF'}, {v:'#FFF6E5'},
  {v:'linear-gradient(135deg,#0B1220,#1B2540)'},
  {v:'linear-gradient(135deg,#3A1C71,#D76D77,#FFAF7B)'},
  {v:'linear-gradient(135deg,#134E5E,#71B280)'},
  {v:'linear-gradient(135deg,#0F2027,#203A43,#2C5364)'},
  {v:'linear-gradient(135deg,#DA22FF,#9733EE)'},
  {v:'linear-gradient(135deg,#F7971E,#FFD200)'},
  {v:'linear-gradient(135deg,#EB3349,#F45C43)'},
];
const COLOR_PRESETS = ['#FFFFFF','#FFB84D','#4ADE80','#7DD3FC','#F87171','#0B1220','#FDE68A','#C4B5FD'];

let state = {
  title:'', message:'',
  bg:'linear-gradient(135deg,#0B1220,#1B2540)', bgIsImage:false,
  font:"'Big Shoulders Display'", color:'#FFFFFF', size:56, hAlign:'center', vAlign:'center',
  imageData:null, duration:'1d', customDate:null
};

/* ---------------- helpers ---------------- */
function computeExpiry(duration, customDate){
  const now = new Date();
  if(duration==='never') return null;
  if(duration==='custom'){
    if(!customDate) return null;
    const t = new Date(customDate).getTime();
    return isNaN(t) ? null : t;
  }
  if(duration==='eod'){ const e=new Date(now); e.setHours(23,59,59,999); return e.getTime(); }
  const map = {'1h':1,'3h':3,'1d':24,'3d':72,'7d':168};
  const hrs = map[duration] || 24;
  return now.getTime() + hrs*3600*1000;
}
function fmtTimeLeft(expiresAt){
  if(expiresAt===null) return 'No expiration';
  const diff = expiresAt - Date.now();
  if(diff<=0) return 'Expired';
  const h = Math.floor(diff/3600000);
  const d = Math.floor(h/24);
  if(d>=1) return `Live · ${d}d ${h%24}h left`;
  if(h>=1) return `Live · ${h}h left`;
  return `Live · ${Math.max(1,Math.floor(diff/60000))}m left`;
}
function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=h*maxDim/w; w=maxDim; }
        else if(h>maxDim){ w=w*maxDim/h; h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- build swatches ---------------- */
function buildSwatches(){
  const bgRow = document.getElementById('bg-swatches');
  BG_PRESETS.forEach(p=>{
    const el = document.createElement('div');
    el.className='swatch';
    el.style.background = p.v;
    if(p.v===state.bg) el.classList.add('selected');
    el.onclick = ()=>{ state.bg=p.v; state.bgIsImage=false;
      document.getElementById('bg-image-hint').style.display='none';
      refreshSwatchSelection(); renderPreview(); };
    bgRow.appendChild(el);
  });
  const custom = document.createElement('label');
  custom.className='swatch custom-color-wrap';
  custom.innerHTML = `<input type="color" value="#334155">`;
  custom.querySelector('input').addEventListener('input', e=>{
    state.bg = e.target.value; state.bgIsImage=false;
    document.getElementById('bg-image-hint').style.display='none';
    refreshSwatchSelection(); renderPreview();
  });
  bgRow.appendChild(custom);

  const colorRow = document.getElementById('color-swatches');
  COLOR_PRESETS.forEach(c=>{
    const el = document.createElement('div');
    el.className='swatch';
    el.style.background = c;
    el.style.border = '2px solid ' + (c===state.color? '#FFB84D':'rgba(255,255,255,0.15)');
    if(c===state.color) el.classList.add('selected');
    el.onclick = ()=>{ state.color=c; refreshSwatchSelection(); renderPreview(); };
    colorRow.appendChild(el);
  });
}
function refreshSwatchSelection(){
  document.querySelectorAll('#bg-swatches .swatch').forEach((el,i)=>{
    if(i<BG_PRESETS.length) el.classList.toggle('selected', BG_PRESETS[i].v===state.bg && !state.bgIsImage);
  });
  document.querySelectorAll('#color-swatches .swatch').forEach((el,i)=>{
    el.classList.toggle('selected', COLOR_PRESETS[i]===state.color);
  });
}

/* ---------------- wire up form ---------------- */
document.getElementById('f-title').addEventListener('input', e=>{ state.title=e.target.value; renderPreview(); });
document.getElementById('f-message').addEventListener('input', e=>{ state.message=e.target.value; renderPreview(); });
document.getElementById('f-font').addEventListener('change', e=>{ state.font=e.target.value; renderPreview(); });
document.getElementById('f-size').addEventListener('input', e=>{
  state.size = parseInt(e.target.value);
  document.getElementById('size-readout').textContent = state.size+'px';
  renderPreview();
});
document.querySelectorAll('#pos-grid button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#pos-grid button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.hAlign = btn.dataset.h;
    state.vAlign = btn.dataset.v;
    renderPreview();
  });
});
document.getElementById('f-duration').addEventListener('change', e=>{
  state.duration = e.target.value;
  document.getElementById('f-custom-wrap').style.display = (e.target.value==='custom') ? 'flex':'none';
  if(e.target.value==='custom') updateCustomDate();
});
function updateCustomDate(){
  const d = document.getElementById('f-custom-date-part').value;
  const t = document.getElementById('f-custom-time-part').value;
  state.customDate = (d && t) ? `${d}T${t}` : (d ? `${d}T23:59` : null);
}
document.getElementById('f-custom-date-part').addEventListener('change', updateCustomDate);
document.getElementById('f-custom-time-part').addEventListener('change', updateCustomDate);
// default the custom date/time pickers to something sensible so they aren't blank
(function(){
  const now = new Date();
  const in1week = new Date(now.getTime() + 7*86400000);
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('f-custom-date-part').value = `${in1week.getFullYear()}-${pad(in1week.getMonth()+1)}-${pad(in1week.getDate())}`;
  document.getElementById('f-custom-time-part').value = '15:00';
  document.getElementById('f-custom-date-part').min = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
})();

document.getElementById('f-bg-upload').addEventListener('change', async e=>{
  const file = e.target.files[0]; if(!file) return;
  const dataUrl = await resizeImage(file, 1600, 0.82);
  state.bg = `url(${dataUrl})`; state.bgIsImage = true;
  document.getElementById('bg-image-hint').style.display='block';
  refreshSwatchSelection(); renderPreview();
});
document.getElementById('f-img-upload').addEventListener('change', async e=>{
  const file = e.target.files[0]; if(!file) return;
  const dataUrl = await resizeImage(file, 1000, 0.82);
  state.imageData = dataUrl;
  const strip = document.getElementById('img-preview-strip');
  strip.style.display='flex';
  strip.innerHTML = `<img src="${dataUrl}"><button onclick="removeAttachedImage()">Remove</button>`;
  renderPreview();
});
function removeAttachedImage(){
  state.imageData = null;
  document.getElementById('img-preview-strip').style.display='none';
  document.getElementById('f-img-upload').value='';
  renderPreview();
}

/* ---------------- preview ---------------- */
function slideInnerHTML(a){
  const hAlign = a.hAlign || a.align || 'center';
  const vAlign = a.vAlign || 'center';
  const textAlign = hAlign==='center' ? 'center' : (hAlign==='flex-end' ? 'right' : 'left');
  const bgStyle = a.bgIsImage ? `background-image:${a.bg};background-size:cover;background-position:center;` : `background:${a.bg};`;
  const textColor = a.color;
  // when text sits over a photo, give it a soft backdrop + shadow so it stays readable anywhere it's placed
  const overPhoto = !!a.imageData || a.bgIsImage;
  const textWrapStyle = overPhoto
    ? `background:rgba(0,0,0,0.38);backdrop-filter:blur(2px);border-radius:14px;padding:0.5em 0.8em;display:inline-block;max-width:100%;`
    : ``;
  return `
    <div style="${bgStyle} width:100%;height:100%;display:flex;align-items:${vAlign};justify-content:${hAlign};padding:6%;box-sizing:border-box;">
      <div style="display:flex;flex-direction:column;align-items:${hAlign};max-width:100%;">
        ${a.imageData && !a.bgIsImage ? `<img class="att" src="${a.imageData}" style="max-width:100%;max-height:38vh;object-fit:contain;border-radius:10px;margin-bottom:0.6em;box-shadow:0 12px 30px -10px rgba(0,0,0,0.5);">` : ''}
        <div style="${textWrapStyle}">
          ${a.title ? `<div style="font-family:${a.font};font-weight:800;color:${textColor};font-size:${a.size*0.62}px;line-height:1.05;margin-bottom:0.25em;text-align:${textAlign};text-shadow:${overPhoto?'0 2px 10px rgba(0,0,0,0.6)':'none'};">${escapeHtml(a.title)}</div>` : ''}
          ${a.message ? `<div class="msg" style="font-family:${a.font};color:${textColor};font-size:${a.size*0.4}px;line-height:1.3;opacity:0.94;text-align:${textAlign};text-shadow:${overPhoto?'0 2px 8px rgba(0,0,0,0.6)':'none'};">${escapeHtml(a.message)}</div>` : ''}
        </div>
      </div>
    </div>`;
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
}
function renderPreview(){
  // always target the stable #preview-frame container directly — never look up a child
  // id that this same function just overwrote, which is what caused the earlier crash
  document.getElementById('preview-frame').innerHTML = slideInnerHTML(state);
  document.getElementById('post-btn').disabled = !(state.title.trim() || state.message.trim());
}

/* ---------------- storage / posting ---------------- */
async function postAnnouncement(){
  const btn = document.getElementById('post-btn');
  const statusEl = document.getElementById('post-status');
  btn.disabled = true; statusEl.textContent = 'Posting...';
  try{
    const id = 'a' + Date.now() + Math.random().toString(36).slice(2,7);
    const expiresAt = computeExpiry(state.duration, state.customDate);
    const record = {
      id, title: state.title.trim(), message: state.message.trim(),
      bg: state.bg, bgIsImage: state.bgIsImage, font: state.font, color: state.color,
      size: state.size, hAlign: state.hAlign, vAlign: state.vAlign, imageData: state.imageData,
      createdAt: Date.now(), expiresAt
    };
    await window.storage.set('announcement:'+id, JSON.stringify(record), true);
    statusEl.textContent = 'Posted! It will appear on the board.';
    statusEl.style.color = 'var(--good)';
    // reset a few fields but keep styling choices for fast repeat posting
    state.title=''; state.message=''; state.imageData=null;
    document.getElementById('f-title').value=''; document.getElementById('f-message').value='';
    document.getElementById('img-preview-strip').style.display='none';
    document.getElementById('f-img-upload').value='';
    renderPreview();
    loadManageList();
  }catch(err){
    statusEl.textContent = 'Could not post — please try again.';
    statusEl.style.color = 'var(--danger)';
    console.error(err);
  }finally{
    btn.disabled = !(state.title.trim() || state.message.trim());
    setTimeout(()=>{ statusEl.textContent=''; }, 4000);
  }
}

async function fetchAllAnnouncements(){
  try{
    const listResult = await window.storage.list('announcement:', true);
    if(!listResult || !listResult.keys) return [];
    const items = [];
    for(const key of listResult.keys){
      try{
        const res = await window.storage.get(key, true);
        if(res && res.value) items.push(JSON.parse(res.value));
      }catch(e){ /* skip unreadable */ }
    }
    items.sort((a,b)=> a.createdAt - b.createdAt);
    return items;
  }catch(e){ console.error(e); return []; }
}

async function loadManageList(){
  const wrap = document.getElementById('manage-list');
  wrap.innerHTML = '<div class="empty-note">Loading...</div>';
  const items = await fetchAllAnnouncements();
  if(items.length===0){ wrap.innerHTML = '<div class="empty-note">Nothing posted yet.</div>'; return; }
  wrap.innerHTML = '';
  items.slice().reverse().forEach(a=>{
    const expired = a.expiresAt!==null && a.expiresAt<=Date.now();
    const card = document.createElement('div');
    card.className='manage-card';
    const swatchStyle = a.bgIsImage ? `background-image:${a.bg};background-size:cover;` : `background:${a.bg};`;
    card.innerHTML = `
      <div class="swatch-mini" style="${swatchStyle}"></div>
      <div class="manage-info">
        <div class="t">${escapeHtml(a.title || '(no title)')}</div>
        <div class="m">${escapeHtml(a.message || '')}</div>
      </div>
      <div class="manage-status ${expired?'expired':'live'}">${expired?'Expired':fmtTimeLeft(a.expiresAt)}</div>
      <button class="del-btn" data-id="${a.id}">Remove</button>
    `;
    card.querySelector('.del-btn').addEventListener('click', async ()=>{
      await window.storage.delete('announcement:'+a.id, true);
      loadManageList();
    });
    wrap.appendChild(card);
  });
}

/* ---------------- tabs ---------------- */
function switchTab(name){
  document.getElementById('tab-post').classList.toggle('active', name==='post');
  document.getElementById('tab-manage').classList.toggle('active', name==='manage');
  document.getElementById('view-post').style.display = name==='post' ? 'grid':'none';
  document.getElementById('view-manage').style.display = name==='manage' ? 'grid':'none';
  if(name==='manage') loadManageList();
}

/* ---------------- board display ---------------- */
let boardTimer=null, boardPollTimer=null, boardItems=[], boardIndex=0;
const SLIDE_SECONDS = 8;

function launchBoard(){
  document.getElementById('board-view').classList.add('active');
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  startBoardLoop();
}
function exitBoard(){
  document.getElementById('board-view').classList.remove('active');
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  clearTimeout(boardTimer); clearInterval(boardPollTimer);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') exitBoard(); });

async function refreshBoardItems(){
  const all = await fetchAllAnnouncements();
  boardItems = all.filter(a=> a.expiresAt===null || a.expiresAt>Date.now());
}
async function startBoardLoop(){
  await refreshBoardItems();
  boardIndex = 0;
  showBoardSlide();
  boardPollTimer = setInterval(refreshBoardItems, 15000);
}
function showBoardSlide(){
  const container = document.getElementById('board-slides');
  const progress = document.getElementById('board-progress');
  clearTimeout(boardTimer);
  if(boardItems.length===0){
    container.innerHTML = `<div class="board-empty"><div class="mk">THE BOARD</div><div>No announcements right now.</div></div>`;
    progress.style.width='0%';
    boardTimer = setTimeout(showBoardSlide, 5000);
    return;
  }
  if(boardIndex>=boardItems.length) boardIndex=0;
  const a = boardItems[boardIndex];
  const slide = document.createElement('div');
  slide.className='board-slide';
  slide.innerHTML = slideInnerHTML(a);
  container.innerHTML='';
  container.appendChild(slide);
  requestAnimationFrame(()=> slide.classList.add('show'));

  progress.style.transition='none';
  progress.style.width='0%';
  requestAnimationFrame(()=>{
    progress.style.transition = `width ${SLIDE_SECONDS}s linear`;
    progress.style.width='100%';
  });

  boardTimer = setTimeout(()=>{
    boardIndex = (boardIndex+1) % boardItems.length;
    showBoardSlide();
  }, SLIDE_SECONDS*1000);
}

/* ---------------- init ---------------- */
buildSwatches();
renderPreview();
// auto-launch straight into board mode if opened with ?board=1 (for the kiosk display's saved browser shortcut)
if(new URLSearchParams(location.search).get('board')==='1'){
  document.getElementById('view-post').style.display='none';
  launchBoard();
}
</script>
